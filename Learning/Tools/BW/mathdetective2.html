      <h1>Math Detective</h1>
      <div id="potentialPoints">Potential Points: 3</div>
      <div id="clue">Clue: —</div>
      <div id="choices"></div>
      <button id="clueBtn" onclick="getClue()">Ask for another clue</button>
      <div id="message"></div>
    </div>
  </div>

  <script>
    let level = 0;
    let points = 0;
    let potentialPoints = 3;
    let targetNumber;
    let cluesGiven = 0;
    let choices = [];

    function isPrime(num) {
      if (num < 2) return false;
      for (let i = 2; i <= Math.sqrt(num); i++) {
        if (num % i === 0) return false;
      }
      return true;
    }
    function uniqueClues(target, all) {
      const others = all.filter(n => n !== target);
      const clues = [];
      if (others.every(n => (n % 2 === 0) !== (target % 2 === 0))) {
        clues.push(target % 2 === 0 ? "It's an even number." : "It's an odd number.");
      }
      [3, 5].forEach(d => {
        const t = target % d === 0;
        if (others.every(n => (n % d === 0) !== t)) {
          clues.push(t ? "It's divisible by " + d + "." : "It's not divisible by " + d + ".");
        }
      });
      const tPrime = isPrime(target);
      if (others.every(n => isPrime(n) !== tPrime)) {
        clues.push(tPrime ? "It's a prime number." : "It's not a prime number.");
      }
      if (others.every(n => n < target)) {
        clues.push("Higher than " + Math.max.apply(null, others) + ".");
      }
      if (others.every(n => n > target)) {
        clues.push("Lower than " + Math.min.apply(null, others) + ".");
      }
      return clues;
    }
    function startLevel() {
      document.getElementById('message').textContent = '';
      potentialPoints = 3;
      cluesGiven = 0;
      document.getElementById('potentialPoints').textContent = "Potential Points: " + potentialPoints;
      let clues = [];
      for (let attempt = 0; attempt < 80; attempt++) {
        targetNumber = Math.floor(Math.random() * 29) + 1;
        const others = [];
        while (others.length < 2) {
          const n = Math.floor(Math.random() * 29) + 1;
          if (n !== targetNumber && !others.includes(n)) others.push(n);
        }
        const all = [targetNumber].concat(others);
        clues = uniqueClues(targetNumber, all);
        if (clues.length) {
          choices = all.sort(() => Math.random() - 0.5);
          window._uniqueClues = clues;
          break;
        }
      }
      if (!window._uniqueClues || !window._uniqueClues.length) {
        window._uniqueClues = ["The number is " + targetNumber + "."];
        choices = [targetNumber, (targetNumber % 29) + 1, (targetNumber + 7) % 29 + 1];
      }
      showChoices();
      showClue();
    }

    function generateChoices() {
      choices = [targetNumber];
      while (choices.length < 3) {
        let num = Math.floor(Math.random() * 30);
        if (!choices.includes(num)) {
          choices.push(num);
        }
      }
      choices.sort(() => Math.random() - 0.5);
    }

    function showChoices() {
      const container = document.getElementById('choices');
      container.innerHTML = '';
      choices.forEach(num => {
        const btn = document.createElement('button');
        btn.textContent = num;
        btn.className = 'choiceBtn';
        btn.onclick = () => makeGuess(num);
        container.appendChild(btn);
      });
    }

 function showClue() {
  const pool = window._uniqueClues || [];
  const clueText = pool[Math.min(cluesGiven, pool.length - 1)] || "Keep looking carefully.";
  document.getElementById('clue').textContent = "Clue: " + clueText;
}

    function getClue() {
      if (cluesGiven < 2) {
        cluesGiven++;
        potentialPoints--;
        document.getElementById('potentialPoints').textContent = `Potential Points: ${potentialPoints}`;
        showClue();
      } else {
        document.getElementById('message').textContent = 'No more clues available!';
      }
    }

    function makeGuess(num) {
      const messageEl = document.getElementById('message');
      if (num === targetNumber) {
        const earned = potentialPoints;
        points += earned;
        document.getElementById('points').textContent = points;
        messageEl.textContent = earned > 0
          ? ("Correct! You earned " + earned + " point" + (earned === 1 ? "" : "s") + ".")
          : "Correct, but this try earned 0 points because of an earlier wrong pick.";
      } else {
        potentialPoints = 0;
        document.getElementById('potentialPoints').textContent = "Potential Points: 0";
        messageEl.textContent = "Wrong guess. You will not get points for this one. You can still find the right number.";
        return;
      }

      if (level < 20) {
        level++;
        setTimeout(startLevel, 2000);
        document.getElementById('level').textContent = level ;
      } else {
        document.getElementById('message').textContent += ' Game Over!';
        document.getElementById('clueBtn').disabled = true;
        document.getElementById('choices').innerHTML = '';
      }
    }

    startLevel();
  </script>
