  <div class="grid" id="grid"></div>

  <script>
    const words = ["JUMP", "PLAY", "KIND", "SMILE", "CLEAN", "BRAVE"];
    const gridSize = 8;
    const grid = document.getElementById("grid");
    const wordList = document.getElementById("wordList").children;
    let cells = [];
    let selectedCells = [];

    // Create grid
    for (let i = 0; i < gridSize * gridSize; i++) {
      const cell = document.createElement("div");
      cell.classList.add("cell");
      cell.dataset.index = i;
      grid.appendChild(cell);
      cells.push(cell);
    }

    function canPlaceWord(word, row, col, dRow, dCol) {
      for (let i = 0; i < word.length; i++) {
        const r = row + dRow * i;
        const c = col + dCol * i;
        if (r < 0 || r >= gridSize || c < 0 || c >= gridSize) return false;
        const existing = cells[r * gridSize + c].textContent;
        if (existing && existing !== word[i]) return false;
      }
      return true;
    }

    function writeWord(word, row, col, dRow, dCol) {
      for (let i = 0; i < word.length; i++) {
        const cell = cells[(row + dRow * i) * gridSize + (col + dCol * i)];
        cell.textContent = word[i];
        const prev = cell.dataset.word ? cell.dataset.word + "," : "";
        cell.dataset.word = prev + word;
        cell.dataset.part = i;
      }
    }

    function tryPlaceAll() {
      const directions = [
        [0, 1], [1, 0]
      ];
      const toPlace = words.slice().sort(function (a, b) { return b.length - a.length; });
      for (let w = 0; w < toPlace.length; w++) {
        const word = toPlace[w];
        let placed = false;
        const dirs = directions.slice();
        for (let i = dirs.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = dirs[i]; dirs[i] = dirs[j]; dirs[j] = tmp;
        }
        for (let attempt = 0; attempt < 250 && !placed; attempt++) {
          const dir = dirs[attempt % dirs.length];
          const row = Math.floor(Math.random() * gridSize);
          const col = Math.floor(Math.random() * gridSize);
          if (canPlaceWord(word, row, col, dir[0], dir[1])) {
            writeWord(word, row, col, dir[0], dir[1]);
            placed = true;
          }
        }
        if (!placed) {
          for (let d = 0; d < dirs.length && !placed; d++) {
            const dir = dirs[d];
            for (let row = 0; row < gridSize && !placed; row++) {
              for (let col = 0; col < gridSize && !placed; col++) {
                if (canPlaceWord(word, row, col, dir[0], dir[1])) {
                  writeWord(word, row, col, dir[0], dir[1]);
                  placed = true;
                }
              }
            }
          }
        }
        if (!placed) return false;
      }
      return true;
    }

    function placeWords() {
      const maxRounds = 25;
      for (let round = 0; round < maxRounds; round++) {
        cells.forEach(function (cell) {
          cell.textContent = "";
          delete cell.dataset.word;
          delete cell.dataset.part;
        });
        if (tryPlaceAll()) return;
      }
      console.warn("Word search: not every word could be placed.");
    }


    // Fill remaining cells with random letters
    function fillGrid() {
      const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      cells.forEach(cell => {
        if (!cell.textContent) {
          cell.textContent = letters[Math.floor(Math.random() * letters.length)];
        }
      });
    }

    placeWords();
    fillGrid();
    
    function showBanner(msg, nextHref, nextLabel) {
      const el = document.getElementById("gameBanner");
      if (!el) return;
      el.textContent = msg;
      el.querySelectorAll("a,button").forEach(n => n.remove());
      // put links after text
      if (nextHref) {
        el.appendChild(document.createTextNode(" "));
        const a = document.createElement("a");
        a.className = "next-tool-btn";
        a.href = nextHref;
        a.textContent = nextLabel || "Next level";
        el.appendChild(a);
      }
    }

    window.onload = () => {
  showBanner("Welcome to Liora's Mythic Word Search 2! Click and drag across letters to highlight a word. Find all 6 to win!");
};

    // Selection logic
    let isMouseDown = false;
    let isTouchSelecting = false;
    const allowDiagonalSelection = false;

    function cellPos(cell) {
      const index = Number(cell.dataset.index);
      return { row: Math.floor(index / gridSize), col: index % gridSize };
    }

    function cellsOnLine(start, end) {
      const a = cellPos(start);
      const b = cellPos(end);
      const dRow = b.row - a.row;
      const dCol = b.col - a.col;
      if (dRow === 0 && dCol === 0) return [start];
      let stepR = 0, stepC = 0;
      if (dRow === 0) {
        stepC = dCol > 0 ? 1 : -1;
      } else if (dCol === 0) {
        stepR = dRow > 0 ? 1 : -1;
      } else if (allowDiagonalSelection && Math.abs(dRow) === Math.abs(dCol)) {
        stepR = dRow > 0 ? 1 : -1;
        stepC = dCol > 0 ? 1 : -1;
      } else {
        return null;
      }
      const steps = Math.max(Math.abs(dRow), Math.abs(dCol));
      const line = [];
      for (let i = 0; i <= steps; i++) {
        line.push(cells[(a.row + stepR * i) * gridSize + (a.col + stepC * i)]);
      }
      return line;
    }

    let selectionStart = null;

    function setSelectionLine(target) {
      if (!selectionStart || !target || !target.classList.contains("cell")) return;
      const line = cellsOnLine(selectionStart, target);
      if (!line) return;
      selectedCells.forEach(function (c) { c.classList.remove("selected"); });
      selectedCells = line;
      selectedCells.forEach(function (c) {
        if (!c.classList.contains("found")) c.classList.add("selected");
      });
    }

    grid.addEventListener("mousedown", e => {
      if (e.target.classList.contains("cell")) {
        isMouseDown = true;
        selectionStart = e.target;
        selectedCells.forEach(function (c) { c.classList.remove("selected"); });
        selectedCells = [e.target];
        if (!e.target.classList.contains("found")) e.target.classList.add("selected");
      }
    });

    grid.addEventListener("mouseover", e => {
      if (isMouseDown) setSelectionLine(e.target);
    });

    document.addEventListener("mouseup", () => {
      finalizeSelection();
      isMouseDown = false;
      selectionStart = null;
    });

    grid.addEventListener("touchstart", e => {
      isTouchSelecting = true;
      e.preventDefault();
      const touch = e.touches[0];
      const target = document.elementFromPoint(touch.clientX, touch.clientY);
      if (target && target.classList.contains("cell")) {
        selectionStart = target;
        selectedCells.forEach(function (c) { c.classList.remove("selected"); });
        selectedCells = [target];
        if (!target.classList.contains("found")) target.classList.add("selected");
      }
    }, { passive: false });

    grid.addEventListener("touchmove", e => {
      if (isTouchSelecting) {
        e.preventDefault();
        const touch = e.touches[0];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        setSelectionLine(target);
      }
    }, { passive: false });

    grid.addEventListener("touchend", () => {
      isTouchSelecting = false;
      finalizeSelection();
      selectionStart = null;
    });

    function finalizeSelection() {

    if (selectedCells.length > 0) {
    const selectedWord = selectedCells.map(c => c.textContent).join("");
    const reversedWord = selectedWord.split("").reverse().join("");
    const matchedWord = words.includes(selectedWord) ? selectedWord : (words.includes(reversedWord) ? reversedWord : null);
    if (matchedWord) {
      selectedCells.forEach(c => c.classList.remove("selected"));
      selectedCells.forEach(c => c.classList.add("found"));
      for (let li of wordList) {
        if (li.textContent === matchedWord) {
          li.classList.add("found");
        }
      }

      // ✅ Check if all words are found
      let foundCount = 0;
      for (let li of wordList) {
        if (li.classList.contains("found")) {
          foundCount++;
        }
      }

      if (foundCount === words.length) {
        confetti({
          particleCount: 150,
          spread: 70,
          origin: { y: 0.6 }
        });

                showBanner('Congratulations! You beat level 2!', 'wordsearch3.html', 'Next: Word Search 3');
        const again = document.createElement('button');
        again.className = 'game-next-btn';
        again.textContent = 'Play again';
        again.onclick = () => location.reload();
        const b = document.getElementById('gameBanner');
        if (b) b.appendChild(again);

      }

    } else {
      selectedCells.forEach(c => c.classList.remove("selected"));
    }
    selectedCells = [];
  }
    }

  </script>
