    <div>
      <h1>Type a Word</h1>
      <input type="text" id="wordInput" placeholder="Enter a word...">
  <div id="gameMessage" role="status"></div>

      <br>
      <button onclick="generateSentence()">Find New Words</button>
    </div>

    <div id="output"></div>
  </div>

  <script>
  
   
async function generateSentence() {
  const word = document.getElementById("wordInput").value.trim();
  const output = document.getElementById("output");
  const gm = document.getElementById("gameMessage");

  if (!word) {
    output.textContent = "";
    if (gm) gm.textContent = "Please enter a word first.";
    return;
  }

  if (gm) gm.textContent = "Thinking...";
  if (output) output.textContent = "";

  try {
    const response = await fetch("https://api.datamuse.com/words?ml=" + encodeURIComponent(word) + "&max=5&_=" + Date.now());
    if (!response.ok) {
      throw new Error("Datamuse request failed: " + response.status);
    }
    const data = await response.json();
    const relatedWords = Array.isArray(data)
      ? data.map(function (item) { return item && item.word; }).filter(Boolean).slice(0, 3)
      : [];

    let sentence = "";
    if (relatedWords.length > 0) {
      sentence = 'The word "' + word + '" brings to mind: ' + relatedWords.join(", ") + ".";
    } else {
      sentence = 'The word "' + word + '" is truly one of a kind.';
    }

    output.textContent = sentence;
    if (gm) gm.textContent = "";

    window.sentencePoints = (Number(window.sentencePoints) || 0) + 1;
    const counter = document.getElementById("counter");
    if (counter) {
      const box = counter.querySelector("div");
      if (box) box.textContent = String(window.sentencePoints);
      else counter.innerHTML = "Points: <div>" + window.sentencePoints + "</div>";
    }

    try {
      if (window.speechSynthesis && window.SpeechSynthesisUtterance) {
        const utterance = new SpeechSynthesisUtterance(sentence);
        window.speechSynthesis.speak(utterance);
      }
    } catch (speechError) {
      console.error(speechError);
    }
  } catch (error) {
    output.textContent = "Oops! Something went wrong.";
    if (gm) {
      gm.textContent = "";
      const again = document.createElement("button");
      again.type = "button";
      again.textContent = "Try again";
      again.addEventListener("click", function () {
        generateSentence();
      });
      gm.appendChild(again);
    }
    console.error(error);
  }
}

</script>
