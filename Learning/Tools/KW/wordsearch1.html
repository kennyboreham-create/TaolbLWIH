  <div class="grid" id="grid"></div>

  <script>
    const words = ["FIRE", "MOON", "WIND", "TREE", "STAR", "ROCK"];
    const gridSize = 8;
    const grid = document.getElementById("grid");
    const wordList = document.getElementById("wordList").children;
    let cells = [];
    let selectedCells = [];

    // Create grid
    for (let i = 0; i < gridSize * gridSize; i++) {
      const cell = document.createElement("div");
      cell.classList.add("cell");
      cell.dataset.index = i;
      grid.appendChild(cell);
      cells.push(cell);
    }

    // Place words horizontally
    function placeWords() {
      words.forEach(word => {
        let placed = false;
        while (!placed) {
          const row = Math.floor(Math.random() * gridSize);
          const col = Math.floor(Math.random() * (gridSize - word.length));
          let fits = true;

          for (let i = 0; i < word.length; i++) {
            const index = row * gridSize + col + i;
            if (cells[index].textContent) {
              fits = false;
              break;
            }
          }

          if (fits) {
            for (let i = 0; i < word.length; i++) {
              const index = row * gridSize + col + i;
              cells[index].textContent = word[i];
              cells[index].dataset.word = word;
              cells[index].dataset.part = i;
            }
            placed = true;
          }
        }
      });
    }

    // Fill remaining cells with random letters
    function fillGrid() {
      const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      cells.forEach(cell => {
        if (!cell.textContent) {
          cell.textContent = letters[Math.floor(Math.random() * letters.length)];
        }
      });
    }

    placeWords();
    fillGrid();
    window.onload = () => {
  alert("🔮 Welcome to Liora's Mythic Word Search!\n\nClick and drag across letters to highlight a word.\nFind all 6 to win!");
};

let isMouseDown = false;


// Mouse Events
grid.addEventListener("mousedown", e => {
  if (e.target.classList.contains("cell")) {
    isMouseDown = true;
    selectedCells = [e.target];
    e.target.classList.add("selected");
  }
});

grid.addEventListener("mouseover", e => {
  if (isMouseDown && e.target.classList.contains("cell") && !selectedCells.includes(e.target)) {
    selectedCells.push(e.target);
    e.target.classList.add("selected");
  }
});

document.addEventListener("mouseup", () => {
  finalizeSelection();
  isMouseDown = false;
});

// Touch Events
grid.addEventListener("touchstart", e => {
  isTouchSelecting = true;
  e.preventDefault(); // block scroll only during selection
  const touch = e.touches[0];
  const target = document.elementFromPoint(touch.clientX, touch.clientY);
  if (target && target.classList.contains("cell")) {
    selectedCells = [target];
    target.classList.add("selected");
  }
}, { passive: false });


grid.addEventListener("touchmove", e => {
  if (isTouchSelecting) {
    e.preventDefault(); // block scroll only if selecting
    const touch = e.touches[0];
    const target = document.elementFromPoint(touch.clientX, touch.clientY);
    if (target && target.classList.contains("cell") && !selectedCells.includes(target)) {
      selectedCells.push(target);
      target.classList.add("selected");
    }
  }
}, { passive: false });



grid.addEventListener("touchend", () => {
  isTouchSelecting = false;
  finalizeSelection();
});


// Finalize Selection Logic
function finalizeSelection() {
  if (selectedCells.length > 0) {
    const selectedWord = selectedCells.map(c => c.textContent).join("");
    if (words.includes(selectedWord)) {
      selectedCells.forEach(c => c.classList.remove("selected"));
      selectedCells.forEach(c => c.classList.add("found"));
      for (let li of wordList) {
        if (li.textContent === selectedWord) {
          li.classList.add("found");
        }
      }

      let foundCount = 0;
      for (let li of wordList) {
        if (li.classList.contains("found")) {
          foundCount++;
        }
      }

      if (foundCount === words.length) {
        confetti({
          particleCount: 150,
          spread: 70,
          origin: { y: 0.6 }
        });

        setTimeout(() => {
          alert("🎉 Congratulations! You found all the words!");
          location.reload();
        }, 500);
      }
    } else {
      selectedCells.forEach(c => c.classList.remove("selected"));
    }
    selectedCells = [];
  }
}


  </script>
